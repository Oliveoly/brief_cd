[project]
name = "brief-cd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "genbadge>=1.1.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "sqlalchemy>=2.0.48",
    "streamlit>=1.19.0",
    "uvicorn>=0.42.0",
]

[tool.pytest.ini_options]
# On force pytest à considérer le dossier app_api comme une source
pythonpath = ["."] 
testpaths = ["tests"]
